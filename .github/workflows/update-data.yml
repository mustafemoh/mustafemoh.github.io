name: Update data

# Refreshes the data on the 1st of each month, and whenever you run it by hand
# (GitHub > Actions > Update data > Run workflow).
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/fetch_data.py
      - run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data downloads
          git diff --cached --quiet || git commit -m "Monthly data refresh"
          git push
